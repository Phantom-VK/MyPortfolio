kotlin.code.style=official
org.gradle.caching=true
# Gradle 8.9 doesn't support running on JDK 23+, but this machine's default
# `java` was bumped to 25 after this project was set up. Pin Gradle itself to
# an installed LTS JDK rather than relying on the system default (which can
# drift again). This only affects the JVM Gradle runs on, not the Kotlin/JS
# output — update this path if JDK 21 is ever removed from this machine.
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64
# Kobweb's generated site index task is not configuration-cache safe here.
org.gradle.configuration-cache=false

# The Kotlin/JS IR linker needs considerably more heap than the default to build
# the development executable, and fails with an OOMErrorException without this.
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m
kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
