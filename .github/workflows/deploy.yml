name: Deploy Kobweb site to GitHub Pages

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    # Pinned, not ubuntu-latest: ubuntu-latest moved to 26.04, which the
    # Playwright version Kobweb's export step bundles can't install Chromium
    # on ("Playwright does not support chromium on ubuntu26.04-x64"). A fresh
    # runner has no pre-existing browser cache to fall back to, so the
    # kobwebExport task hard-fails rather than just warning. 24.04 is a
    # supported target for this Playwright version.
    runs-on: ubuntu-24.04
    env:
      VISIT_NOTIFY_API_BASE_URL: ${{ vars.VISIT_NOTIFY_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build static export
        run: ./gradlew :site:kobwebExport -PkobwebExportLayout=STATIC -PkobwebEnvironment=PROD --no-daemon

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.kobweb/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
